# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Show the raw characters (e.g. "!=") under the cursor so ligatures don't hide what you're editing
disable_ligatures cursor

# Theme (palette shared with Waybar / rofi / swaync)
include theme.conf

# Window Padding (Makes code breathe)
window_padding_width 10
# Slight transparency so Hyprland's blur shows through; 1.0 to disable
background_opacity 0.92

# Cursor
cursor_shape beam
cursor_trail 3

# Selection & Clipboard
# Highlighting copies to the clipboard (and therefore into cliphist history)
copy_on_select clipboard
# Drop trailing whitespace when copying ragged output (e.g. from ls or tables)
strip_trailing_spaces smart

# Scrollback
scrollback_lines 10000

# Bell: no sound; mark the window urgent so Waybar highlights its workspace
enable_audio_bell    no
window_alert_on_bell yes

# Desktop notification (via swaync) when a command taking >10s finishes while kitty is unfocused
notify_on_cmd_finish unfocused 10.0

# Tab bar
tab_bar_edge  bottom
tab_bar_style powerline

# Tiling WM sizes the window; don't restore stale geometry
remember_window_size no

# Performance
repaint_delay    8
input_delay      2
sync_to_monitor  yes
