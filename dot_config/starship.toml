# Colours are ANSI names on purpose: kitty maps them to theme.ansi in
# .chezmoidata/theme.toml, so the prompt follows the palette without a
# starship palette block. blue = accent, bright-black = muted.

[directory]
style = "bold blue"

[nodejs]
symbol = " "
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_extensions = ["js", "ts", "jsx", "tsx"]
disabled = false

[bun]
symbol = "🥟 "
style = "bold yellow"
detect_files = ["bun.lock", "bun.lockb", "bunfig.toml"]
disabled = false