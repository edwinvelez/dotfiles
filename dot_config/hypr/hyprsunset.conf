# Night light (hyprsunset, started by hyprsunset.service via graphical-session.target).
# Each profile applies from its time until the next one; times are local.
# Override for now:  hyprctl hyprsunset temperature 3500  /  hyprctl hyprsunset identity

# Day: no colour change (identity keeps colours accurate for design work)
profile {
    time = 7:00
    identity = true
}

# Evening: warm, gentle enough to keep the accent recognisable
profile {
    time = 20:00
    temperature = 4500
}
