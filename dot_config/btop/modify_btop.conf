#!/usr/bin/env python3
# chezmoi modify_ script for ~/.config/btop/btop.conf.
# btop rewrites the whole file on exit (save_config_on_exit), so a full managed copy
# drifts on every btop update. Only the keys below are enforced; the rest is btop's.
# A missing file yields just these keys; btop fills in its defaults on next start.
import re
import sys

MANAGED = {
    "color_theme": '"palette"',  # themes/palette.theme, generated from theme.toml
}

lines = sys.stdin.read().splitlines()
for key, value in MANAGED.items():
    pattern = re.compile(rf"^{re.escape(key)}\s*=")
    new = f"{key} = {value}"
    for i, line in enumerate(lines):
        if pattern.match(line):
            lines[i] = new
            break
    else:
        lines.append(new)

sys.stdout.write("\n".join(lines) + "\n")
