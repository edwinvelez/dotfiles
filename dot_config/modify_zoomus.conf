#!/usr/bin/env python3
# chezmoi modify_ script for ~/.config/zoomus.conf.
# chezmoi pipes the current file in on stdin and writes back whatever this prints.
# Only the keys below are enforced; everything else Zoom stores is preserved.
import configparser
import io
import sys

MANAGED = {
    "General": {
        "enableWaylandShare": "true",
        "xwayland": "true",
        "enableQmlCache": "true",
        "captureHDCamera": "true",
        "autoScale": "true",
        "bForceMaximizeWM": "false",
        "enableCefGpu": "false",
        "enablegpucomputeutilization": "false",
        "CefOsrWindowlessFrameRate": "30",
        "enableAlphaBuffer": "true",
        "enableScreenSaveGuard": "false",
    },
    "AS": {
        "showframewindow": "true",
    },
}

config = configparser.RawConfigParser(strict=False)
config.optionxform = str  # Zoom keys are case-sensitive
config.read_string(sys.stdin.read())

for section, values in MANAGED.items():
    if not config.has_section(section):
        config.add_section(section)
    for key, value in values.items():
        config.set(section, key, value)

# configparser ends every section with a blank line; Zoom does not. Match Zoom's
# formatting so the file does not show as drifted after Zoom rewrites it.
out = io.StringIO()
config.write(out, space_around_delimiters=False)
sys.stdout.write(out.getvalue().rstrip("\n") + "\n")
