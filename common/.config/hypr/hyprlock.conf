general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 24-Hour Clock
label {
    monitor =
    text = $TIME
    color = rgba(220, 220, 220, 1.0)
    font_size = 80
    font_family = Inter ExtraBold

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)

    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(200, 200, 200, 1.0)
    font_size = 22
    font_family = Inter Medium
    position = 0, 30
    halign = center
    valign = center
}

# User Input Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(5294e2ee)
    inner_color = rgba(33, 33, 33, 0.9)
    font_color = rgb(220, 220, 220)

    capslock_color = rgba(255, 165, 0, 1.0) # Orange when Caps Lock is on
    fail_color = rgba(255, 0, 0, 1.0) # Red on failure
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false

    position = 0, -50
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/edwinvelez/.face.icon
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgba(5294e2ee)
    position = 0, 180
    halign = center
    valign = center
}
